<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mobile-bg" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="100%" stop-color="#FFF2F4"/>
    </linearGradient>

    <!-- Hero Card Gradient -->
    <linearGradient id="hero-grad" x1="0" y1="0" x2="358" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#702632"/>
      <stop offset="100%" stop-color="#4E1620"/>
    </linearGradient>

    <!-- Center Button Gradient -->
    <linearGradient id="center-btn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B2F3E"/>
      <stop offset="100%" stop-color="#5A1E29"/>
    </linearGradient>

    <!-- Elevation Shadows -->
    <filter id="m-shadow-card" x="-4" y="-2" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#461928" flood-opacity="0.06"/>
    </filter>
    <filter id="m-shadow-center" x="-8" y="-4" width="132%" height="132%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#702632" flood-opacity="0.38"/>
    </filter>
    <filter id="m-bottom-nav-shadow" x="0" y="-4" width="390" height="88" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#461928" flood-opacity="0.05"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>

  <!-- 1. Background Canvas -->
  <rect width="390" height="844" fill="url(#mobile-bg)"/>

  <!-- ======================================================== -->
  <!-- 2. NATIVE STATUS BAR (44px)                              -->
  <!-- ======================================================== -->
  <g id="Mobile-Status-Bar">
    <!-- Clock -->
    <text x="32" y="32" fill="#292027" class="font-sans" font-size="14.5" font-weight="700">9:41</text>
    
    <!-- Status Icons (Cellular, Wifi, Battery) -->
    <g transform="translate(316, 20)">
      <!-- Signal -->
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#292027"/>
      <rect x="4" y="6" width="3" height="6" rx="0.5" fill="#292027"/>
      <rect x="8" y="4" width="3" height="8" rx="0.5" fill="#292027"/>
      <rect x="12" y="1" width="3" height="11" rx="0.5" fill="#292027"/>
      
      <!-- Wifi -->
      <path d="M19 1C21 0 24 0 26 1M18 4C20 3 25 3 27 4M20 8C22 7 23 7 25 8M22.5 11.5A1 1 0 1 1 22.5 12" stroke="#292027" stroke-width="1.6" stroke-linecap="round"/>
      
      <!-- Battery -->
      <rect x="33" y="2" width="22" height="11" rx="3.5" stroke="#292027" stroke-width="1.4" fill="none"/>
      <rect x="35" y="4" width="15" height="7" rx="1.5" fill="#292027"/>
      <path d="M56 5.5V9.5" stroke="#292027" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 3. TOP APP BAR (56px)                                    -->
  <!-- ======================================================== -->
  <g id="Mobile-Top-App-Bar" transform="translate(0, 44)">
    <rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="390" y2="56" stroke="#E9DDE1" stroke-width="1"/>

    <!-- Left Brand Badge -->
    <g transform="translate(16, 12)">
      <rect x="0" y="0" width="32" height="32" rx="9" fill="#702632"/>
      <path d="M10 22V15L16 10L22 15V22H10Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="21" fill="#292027" class="font-sans" font-size="16" font-weight="800" letter-spacing="-0.03em">FinTrack</text>
      <rect x="110" y="7" width="36" height="17" rx="8.5" fill="#FFF1F2" stroke="#E9DDE1" stroke-width="1"/>
      <text x="117" y="19" fill="#702632" class="font-sans" font-size="8.5" font-weight="800">APK</text>
    </g>

    <!-- Right Header Actions (Search, Bell, Avatar) -->
    <g transform="translate(268, 12)">
      <!-- Search Button -->
      <circle cx="16" cy="16" r="15" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="15" cy="15" r="4.5" stroke="#74636A" stroke-width="1.4"/>
      <line x1="18.5" y1="18.5" x2="21" y2="21" stroke="#74636A" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Notification Bell with Red Badge -->
      <g transform="translate(40, 0)">
        <circle cx="16" cy="16" r="15" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <path d="M16 10C14 10 12.5 11.5 12.5 13.5V17L11 18.5V19.5H21V18.5L19.5 17V13.5C19.5 11.5 18 10 16 10Z" stroke="#74636A" stroke-width="1.3" fill="none"/>
        <circle cx="21" cy="10" r="4" fill="#702632" stroke="#FFFFFF" stroke-width="1.2"/>
      </g>

      <!-- User Avatar -->
      <circle cx="94" cy="16" r="16" fill="#702632"/>
      <text x="87" y="20.5" fill="#FFFFFF" class="font-sans" font-size="11" font-weight="800">AV</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 4. SCROLLABLE SCREEN CONTENT AREA                        -->
  <!-- ======================================================== -->

  <!-- HERO: SAFE-TO-SPEND DAILY CARD -->
  <g id="Mobile-Hero-Card" transform="translate(16, 114)">
    <rect x="0" y="0" width="358" height="152" rx="20" fill="url(#hero-grad)"/>

    <!-- Subtle Glass Specular Accent -->
    <path d="M0 20C0 8.95431 8.95431 0 20 0H338C349.046 0 358 8.95431 358 20V50L0 70V20Z" fill="white" fill-opacity="0.04"/>

    <!-- Top Badge Row -->
    <text x="20" y="32" fill="#E9A3B0" class="font-sans" font-size="11" font-weight="750" letter-spacing="0.06em">SAFE-TO-SPEND TODAY</text>
    
    <rect x="256" y="18" width="82" height="22" rx="11" fill="rgba(255, 255, 255, 0.16)"/>
    <circle cx="268" cy="29" r="3.5" fill="#34D399"/>
    <text x="276" y="33" fill="#FFFFFF" class="font-sans" font-size="10" font-weight="700">8 Days Left</text>

    <!-- Large Tabular Daily Allowance -->
    <text x="20" y="74" fill="#FFFFFF" class="font-sans tabular-nums" font-size="34" font-weight="800" letter-spacing="-0.02em">$142.50</text>
    <text x="175" y="72" fill="#E9A3B0" class="font-sans" font-size="13" font-weight="600">/ day</text>

    <!-- Progress Gauge -->
    <rect x="20" y="96" width="318" height="6" rx="3" fill="rgba(255, 255, 255, 0.22)"/>
    <rect x="20" y="96" width="210" height="6" rx="3" fill="#34D399"/>

    <!-- Footer Stats -->
    <text x="20" y="126" fill="#FCE7F3" class="font-sans" font-size="11.5" font-weight="600">Total Buffer: <tspan fill="#FFFFFF" font-weight="800">$2,280.00</tspan></text>
    <text x="338" y="126" fill="#A7F3D0" class="font-sans" font-size="11.5" font-weight="700" text-anchor="end">Healthy (68%)</text>
  </g>

  <!-- 3-BUTTON QUICK ACTION STRIP -->
  <g id="Quick-Action-Strip" transform="translate(16, 278)">
    <!-- Action 1: Add Expense -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="112" height="42" rx="12" fill="#FFFFFF" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="22" cy="21" r="10" fill="#FFF1F2"/>
      <text x="18" y="25" fill="#702632" class="font-sans" font-size="13" font-weight="800">+</text>
      <text x="38" y="25.5" fill="#292027" class="font-sans" font-size="11.5" font-weight="700">Expense</text>
    </g>

    <!-- Action 2: Transfer -->
    <g transform="translate(123, 0)">
      <rect x="0" y="0" width="112" height="42" rx="12" fill="#FFFFFF" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="22" cy="21" r="10" fill="#EFF6FF"/>
      <text x="18" y="24" fill="#2563EB" class="font-sans" font-size="11" font-weight="800">⇄</text>
      <text x="38" y="25.5" fill="#292027" class="font-sans" font-size="11.5" font-weight="700">Transfer</text>
    </g>

    <!-- Action 3: Analytics -->
    <g transform="translate(246, 0)">
      <rect x="0" y="0" width="112" height="42" rx="12" fill="#FFFFFF" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="22" cy="21" r="10" fill="#F0FDF4"/>
      <text x="18" y="24" fill="#15803D" class="font-sans" font-size="11" font-weight="800">⚡</text>
      <text x="38" y="25.5" fill="#292027" class="font-sans" font-size="11.5" font-weight="700">Insights</text>
    </g>
  </g>

  <!-- HORIZONTAL ACCOUNTS CAROUSEL SECTION -->
  <g id="Accounts-Carousel" transform="translate(16, 336)">
    <text x="0" y="14" fill="#292027" class="font-sans" font-size="14" font-weight="800">Liquid Accounts</text>
    <text x="358" y="14" fill="#702632" class="font-sans" font-size="12" font-weight="700" text-anchor="end">Manage →</text>

    <!-- Account Card 1: Checking -->
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="170" height="76" rx="14" fill="#FFFFFF" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#FFF1F2"/>
      <text x="18" y="26" fill="#702632" class="font-sans" font-size="11" font-weight="800">🏦</text>
      <text x="40" y="22" fill="#74636A" class="font-sans" font-size="10.5" font-weight="600">Chase Checking</text>
      <text x="14" y="56" fill="#292027" class="font-sans tabular-nums" font-size="17" font-weight="800">$8,420.50</text>
    </g>

    <!-- Account Card 2: High Yield Savings -->
    <g transform="translate(180, 26)">
      <rect x="0" y="0" width="178" height="76" rx="14" fill="#FFFFFF" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#F0FDF4"/>
      <text x="18" y="26" fill="#15803D" class="font-sans" font-size="11" font-weight="800">💰</text>
      <text x="40" y="22" fill="#74636A" class="font-sans" font-size="10.5" font-weight="600">Marcus 4.4% HYSA</text>
      <text x="14" y="56" fill="#15803D" class="font-sans tabular-nums" font-size="17" font-weight="800">$42,180.00</text>
    </g>
  </g>

  <!-- GROUPED DAILY FEED SECTION -->
  <g id="Grouped-Daily-Feed" transform="translate(16, 456)">
    <!-- Header: TODAY -->
    <text x="0" y="14" fill="#897982" class="font-sans" font-size="11" font-weight="800" letter-spacing="0.06em">TODAY • OCT 21</text>
    
    <!-- Feed Card Container -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="358" height="234" rx="16" fill="#FFFFFF" stroke="#E9DDE1" stroke-width="1"/>

      <!-- Item 1: Apple Inc Salary -->
      <g transform="translate(16, 12)">
        <circle cx="18" cy="20" r="16" fill="#F0FDF4"/>
        <text x="13" y="25" fill="#15803D" class="font-sans" font-size="13" font-weight="800"></text>
        <text x="46" y="16" fill="#292027" class="font-sans" font-size="13.5" font-weight="700">Apple Inc. Payroll</text>
        <text x="46" y="32" fill="#897982" class="font-sans" font-size="11">Checking ••4812 • 9:30 AM</text>
        <text x="326" y="24" fill="#15803D" class="font-mono tabular-nums" font-size="14.5" font-weight="800" text-anchor="end">+$6,450.00</text>
      </g>
      <line x1="62" y1="62" x2="342" y2="62" stroke="#F6EEF1" stroke-width="1"/>

      <!-- Item 2: Whole Foods -->
      <g transform="translate(16, 70)">
        <circle cx="18" cy="20" r="16" fill="#FFF1F2"/>
        <text x="12" y="24" fill="#702632" class="font-sans" font-size="12" font-weight="800">🛒</text>
        <text x="46" y="16" fill="#292027" class="font-sans" font-size="13.5" font-weight="700">Whole Foods Organic</text>
        <text x="46" y="32" fill="#897982" class="font-sans" font-size="11">Amex ••9021 • Groceries</text>
        <text x="326" y="24" fill="#702632" class="font-mono tabular-nums" font-size="14.5" font-weight="800" text-anchor="end">-$148.60</text>
      </g>
      <line x1="62" y1="120" x2="342" y2="120" stroke="#F6EEF1" stroke-width="1"/>

      <!-- Item 3: Starbucks Reserve -->
      <g transform="translate(16, 128)">
        <circle cx="18" cy="20" r="16" fill="#FFFBEB"/>
        <text x="12" y="24" fill="#B45309" class="font-sans" font-size="12" font-weight="800">☕</text>
        <text x="46" y="16" fill="#292027" class="font-sans" font-size="13.5" font-weight="700">Starbucks Reserve</text>
        <text x="46" y="32" fill="#897982" class="font-sans" font-size="11">Checking ••4812 • Dining</text>
        <text x="326" y="24" fill="#702632" class="font-mono tabular-nums" font-size="14.5" font-weight="800" text-anchor="end">-$7.25</text>
      </g>
      <line x1="62" y1="178" x2="342" y2="178" stroke="#F6EEF1" stroke-width="1"/>

      <!-- Item 4: Vanguard Automated Transfer -->
      <g transform="translate(16, 186)">
        <circle cx="18" cy="20" r="16" fill="#EFF6FF"/>
        <text x="12" y="24" fill="#2563EB" class="font-sans" font-size="12" font-weight="800">📈</text>
        <text x="46" y="16" fill="#292027" class="font-sans" font-size="13.5" font-weight="700">Vanguard Auto-Invest</text>
        <text x="46" y="32" fill="#897982" class="font-sans" font-size="11">Brokerage ••1109 • S&amp;P 500</text>
        <text x="326" y="24" fill="#2563EB" class="font-mono tabular-nums" font-size="14.5" font-weight="800" text-anchor="end">-$1,000.00</text>
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 5. DOCKED 5-SLOT BOTTOM NAVIGATION BAR                   -->
  <!-- ======================================================== -->
  <g id="Mobile-Docked-Bottom-Nav" transform="translate(0, 756)">
    <!-- Base Surface -->
    <rect x="0" y="0" width="390" height="88" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#E9DDE1" stroke-width="1"/>

    <!-- Slot 1: Home (Active) -->
    <g transform="translate(24, 10)">
      <path d="M12 4L4 10V20H9V14H15V20H20V10L12 4Z" fill="#702632"/>
      <text x="12" y="30" fill="#702632" class="font-sans" font-size="10" font-weight="800" text-anchor="middle">Home</text>
    </g>

    <!-- Slot 2: Activity / Ledger -->
    <g transform="translate(98, 10)">
      <path d="M6 6H18M6 11H14M6 16H18" stroke="#897982" stroke-width="1.8" stroke-linecap="round"/>
      <text x="12" y="30" fill="#897982" class="font-sans" font-size="10" font-weight="600" text-anchor="middle">Activity</text>
    </g>

    <!-- Slot 3: Center Elevated Action Button (48px circle, translateY -12px) -->
    <g id="Elevated-Center-CTA" transform="translate(171, -12)" filter="url(#m-shadow-center)">
      <circle cx="24" cy="24" r="24" fill="url(#center-btn-grad)" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Crisp Plus Icon -->
      <path d="M24 16V32M16 24H32" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Slot 4: Budgets -->
    <g transform="translate(268, 10)">
      <circle cx="12" cy="11" r="7" stroke="#897982" stroke-width="1.8" fill="none"/>
      <path d="M12 8V11L14 13" stroke="#897982" stroke-width="1.6" stroke-linecap="round"/>
      <text x="12" y="30" fill="#897982" class="font-sans" font-size="10" font-weight="600" text-anchor="middle">Budgets</text>
    </g>

    <!-- Slot 5: More -->
    <g transform="translate(342, 10)">
      <circle cx="12" cy="7" r="1.8" fill="#897982"/>
      <circle cx="12" cy="12" r="1.8" fill="#897982"/>
      <circle cx="12" cy="17" r="1.8" fill="#897982"/>
      <text x="12" y="30" fill="#897982" class="font-sans" font-size="10" font-weight="600" text-anchor="middle">More</text>
    </g>

    <!-- Native Gesture Indicator Bar -->
    <rect x="127" y="74" width="136" height="5" rx="2.5" fill="#292027"/>
  </g>
</svg>
