<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sheet-bg" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="100%" stop-color="#FFF2F4"/>
    </linearGradient>

    <!-- Brand Button Gradient -->
    <linearGradient id="btn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#702632"/>
      <stop offset="100%" stop-color="#5A1E29"/>
    </linearGradient>

    <!-- Sheet Shadow -->
    <filter id="sheet-shadow" x="-8" y="-12" width="406" height="660" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>

  <!-- 1. Background Canvas (Dimmed Backdrop) -->
  <rect width="390" height="844" fill="#090D16" fill-opacity="0.6"/>

  <!-- ======================================================== -->
  <!-- 2. SLIDE-UP BOTTOM SHEET (390 x 620)                     -->
  <!-- ======================================================== -->
  <g id="Quick-Add-Modal-Sheet" transform="translate(0, 224)" filter="url(#sheet-shadow)">
    <!-- Sheet Surface -->
    <path d="M0 24C0 10.7452 10.7452 0 24 0H366C379.255 0 390 10.7452 390 24V620H0V24Z" fill="#FFFFFF"/>

    <!-- Pull Handle -->
    <rect x="175" y="10" width="40" height="5" rx="2.5" fill="#E9DDE1"/>

    <!-- Sheet Header -->
    <g transform="translate(24, 28)">
      <text x="0" y="18" fill="#292027" class="font-sans" font-size="18" font-weight="800">Add Transaction</text>
      <!-- Close Button -->
      <circle cx="332" cy="12" r="14" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
      <path d="M327 7L337 17M337 7L327 17" stroke="#74636A" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <line x1="0" y1="62" x2="390" y2="62" stroke="#F1E6EA" stroke-width="1"/>

    <!-- Segmented Type Selector [ Expense | Income | Transfer ] -->
    <g transform="translate(24, 78)">
      <rect x="0" y="0" width="342" height="42" rx="10" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
      
      <!-- Expense (Active) -->
      <rect x="3" y="3" width="110" height="36" rx="8" fill="#702632"/>
      <text x="58" y="25" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="750" text-anchor="middle">Expense</text>
      
      <!-- Income -->
      <text x="171" y="25" fill="#74636A" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">Income</text>
      
      <!-- Transfer -->
      <text x="285" y="25" fill="#74636A" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">Transfer</text>
    </g>

    <!-- Large Amount Display & Currency Symbol -->
    <g transform="translate(24, 142)">
      <text x="0" y="16" fill="#897982" class="font-sans" font-size="11" font-weight="700" letter-spacing="0.06em">AMOUNT</text>
      
      <!-- Amount Box -->
      <g transform="translate(0, 26)">
        <text x="0" y="44" fill="#702632" class="font-sans tabular-nums" font-size="44" font-weight="800">$ 48.50</text>
        <rect x="178" y="6" width="3" height="44" fill="#702632">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Title / Description Field -->
    <g transform="translate(24, 234)">
      <text x="0" y="14" fill="#897982" class="font-sans" font-size="11" font-weight="700" letter-spacing="0.06em">MERCHANT OR DESCRIPTION</text>
      <rect x="0" y="22" width="342" height="44" rx="10" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
      <circle cx="20" cy="44" r="10" fill="#FFF1F2"/>
      <text x="16" y="48" fill="#702632" class="font-sans" font-size="11" font-weight="800">🛒</text>
      <text x="38" y="49" fill="#292027" class="font-sans" font-size="13.5" font-weight="650">Whole Foods Organic</text>
    </g>

    <!-- Category Pill Selector -->
    <g transform="translate(24, 322)">
      <text x="0" y="14" fill="#897982" class="font-sans" font-size="11" font-weight="700" letter-spacing="0.06em">SELECT CATEGORY</text>
      
      <g transform="translate(0, 24)">
        <!-- Pill 1: Groceries (Selected) -->
        <rect x="0" y="0" width="102" height="34" rx="17" fill="#FFF1F2" stroke="#702632" stroke-width="1.6"/>
        <text x="14" y="21" fill="#702632" class="font-sans" font-size="12" font-weight="750">🛒 Groceries</text>

        <!-- Pill 2: Dining -->
        <rect x="110" y="0" width="84" height="34" rx="17" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="122" y="21" fill="#74636A" class="font-sans" font-size="12" font-weight="600">☕ Dining</text>

        <!-- Pill 3: Shopping -->
        <rect x="202" y="0" width="96" height="34" rx="17" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="214" y="21" fill="#74636A" class="font-sans" font-size="12" font-weight="600">🛍 Shopping</text>
      </g>

      <g transform="translate(0, 68)">
        <!-- Pill 4: Transport -->
        <rect x="0" y="0" width="98" height="34" rx="17" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="14" y="21" fill="#74636A" class="font-sans" font-size="12" font-weight="600">🚗 Transit</text>

        <!-- Pill 5: Health -->
        <rect x="106" y="0" width="86" height="34" rx="17" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="118" y="21" fill="#74636A" class="font-sans" font-size="12" font-weight="600">⚡ Health</text>

        <!-- Pill 6: Bills -->
        <rect x="200" y="0" width="80" height="34" rx="17" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="212" y="21" fill="#74636A" class="font-sans" font-size="12" font-weight="600">📄 Bills</text>
      </g>
    </g>

    <!-- Account & Date Pickers Row -->
    <g transform="translate(24, 448)">
      <!-- Account Dropdown -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" fill="#897982" class="font-sans" font-size="11" font-weight="700">ACCOUNT</text>
        <rect x="0" y="18" width="200" height="42" rx="10" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="14" y="44" fill="#292027" class="font-sans" font-size="12.5" font-weight="650">Chase ••4812</text>
        <path d="M180 40L185 45L190 40" stroke="#74636A" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Date Dropdown -->
      <g transform="translate(212, 0)">
        <text x="0" y="12" fill="#897982" class="font-sans" font-size="11" font-weight="700">DATE</text>
        <rect x="0" y="18" width="130" height="42" rx="10" fill="#FFF8F8" stroke="#E9DDE1" stroke-width="1"/>
        <text x="14" y="44" fill="#292027" class="font-sans" font-size="12.5" font-weight="650">Today, Oct 21</text>
      </g>
    </g>

    <!-- Full-Width Save CTA Button -->
    <g transform="translate(24, 534)">
      <rect x="0" y="0" width="342" height="48" rx="12" fill="url(#btn-grad)"/>
      <text x="171" y="29.5" fill="#FFFFFF" class="font-sans" font-size="15" font-weight="800" text-anchor="middle">Save Expense • $48.50</text>
    </g>

    <!-- Bottom Indicator -->
    <rect x="127" y="604" width="136" height="5" rx="2.5" fill="#292027"/>
  </g>
</svg>
