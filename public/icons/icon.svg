<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Base squircle gradient -->
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1320" />
      <stop offset="55%" stop-color="#250912" />
      <stop offset="100%" stop-color="#120409" />
    </linearGradient>

    <!-- Golden Emerald Growth Gradient -->
    <linearGradient id="ftGrowth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Outer Border Stroke -->
    <linearGradient id="ftBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="50%" stop-color="rgba(225, 29, 72, 0.45)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.4)" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ftOrb" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.15" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#ftBg)" />
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#ftOrb)" />
  <rect x="18" y="18" width="476" height="476" rx="126" stroke="url(#ftBorder)" stroke-width="6" fill="none" />

  <!-- 2. Geometric Asset Ledger Grid Lines -->
  <line x1="112" y1="368" x2="400" y2="368" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-dasharray="12 12" />
  <line x1="112" y1="256" x2="400" y2="256" stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-dasharray="12 12" />

  <!-- 3. Asset Pillars -->
  <rect x="112" y="280" width="40" height="88" rx="16" fill="rgba(255, 255, 255, 0.22)" />
  <rect x="176" y="208" width="40" height="160" rx="16" fill="rgba(255, 255, 255, 0.38)" />
  <rect x="240" y="160" width="40" height="208" rx="16" fill="url(#ftGrowth)" fill-opacity="0.65" />

  <!-- 4. Dynamic Continuous Rising Ribbon -->
  <path
    d="M 112 344 Q 176 328 224 248 T 336 136 L 392 96"
    fill="none"
    stroke="url(#ftGrowth)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Precision Arrow Head / Wealth Peak -->
  <path
    d="M 304 96 H 392 V 184"
    fill="none"
    stroke="#34D399"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. Top-Right Investment Diamond Star -->
  <path
    d="M 392 96 L 420 68 L 392 40 L 364 68 Z"
    fill="#34D399"
    filter="url(#glow)"
  />
  <circle cx="392" cy="96" r="14" fill="#FFFFFF" />

  <!-- 6. Compounding Nodes -->
  <circle cx="224" cy="248" r="18" fill="#F59E0B" />
  <circle cx="112" cy="344" r="16" fill="#E11D48" />
</svg>
