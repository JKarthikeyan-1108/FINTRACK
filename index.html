<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#702632" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinTrack" />
  <meta name="application-name" content="FinTrack" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="FinTrack - Premium Personal Finance, Real-Time Budgets, Goals, and Portfolio Intelligence" />
  <title>FinTrack - Wealth Intelligence</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('themePreference') || localStorage.getItem('theme') || 'system';
        var effective = pref;
        if (pref === 'system' || (pref !== 'light' && pref !== 'dark')) {
          effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', effective);
        document.documentElement.setAttribute('data-theme-preference', pref);
        document.documentElement.style.colorScheme = effective;
        if (effective === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#191219');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root { color-scheme: light; }
    [data-theme="dark"] { color-scheme: dark; }
    html, body {
      background: #FFF8F8;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    [data-theme="dark"] html,
    [data-theme="dark"] body {
      background: #191219;
    }
    #root { min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
