<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#702632" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinTrack" />
  <meta name="application-name" content="FinTrack" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="FinTrack - Premium Personal Finance, Real-Time Budgets, Goals, and Portfolio Intelligence" />
  <title>FinTrack - Wealth Intelligence</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('themePreference') || localStorage.getItem('theme') || 'system';
        var effective = pref;
        if (pref === 'system' || (pref !== 'light' && pref !== 'dark')) {
          effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', effective);
        document.documentElement.setAttribute('data-theme-preference', pref);
        document.documentElement.style.colorScheme = effective;
        if (effective === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#191219');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root { color-scheme: light; }
    [data-theme="dark"] { color-scheme: dark; }
    html, body {
      background: #FFF8F8;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    [data-theme="dark"] html,
    [data-theme="dark"] body {
      background: #191219;
    }
    #root { min-height: 100dvh; display: flex; flex-direction: column; }
    .ft-preloader {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFF8F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      user-select: none;
    }
    [data-theme="dark"] .ft-preloader {
      background: #191219;
      color: #FFF1F2;
    }
    .ft-pre-orbital {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .ft-pre-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #702632;
      border-right-color: #A83F55;
      animation: ftPreSpin 1.2s cubic-bezier(0.6, 0.05, 0.28, 0.9) infinite;
    }
    [data-theme="dark"] .ft-pre-ring {
      border-top-color: #F2B7C3;
      border-right-color: #E18A9D;
    }
    .ft-pre-emblem {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #702632 0%, #A83F55 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(112, 38, 50, 0.4);
    }
    .ft-pre-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #292027;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    [data-theme="dark"] .ft-pre-title {
      color: #FFF1F2;
    }
    .ft-pre-sub {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #A83F55;
      margin-bottom: 20px;
    }
    [data-theme="dark"] .ft-pre-sub {
      color: #F2B7C3;
    }
    .ft-pre-bar {
      width: 140px;
      height: 4px;
      background: #E9DDE1;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    [data-theme="dark"] .ft-pre-bar {
      background: #493540;
    }
    .ft-pre-fill {
      height: 100%;
      width: 45%;
      border-radius: 99px;
      background: #702632;
      animation: ftPreFill 1.5s ease-in-out infinite alternate;
    }
    [data-theme="dark"] .ft-pre-fill {
      background: #F2B7C3;
    }
    @keyframes ftPreSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes ftPreFill {
      0% { transform: translateX(0); width: 20%; }
      100% { transform: translateX(90px); width: 50%; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="ft-preloader">
      <div class="ft-pre-orbital">
        <div class="ft-pre-ring"></div>
        <div class="ft-pre-emblem">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
            <polyline points="16 7 22 7 22 13"></polyline>
          </svg>
        </div>
      </div>
      <div class="ft-pre-title">FinTrack</div>
      <div class="ft-pre-sub">Wealth Intelligence</div>
      <div class="ft-pre-bar">
        <div class="ft-pre-fill"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
