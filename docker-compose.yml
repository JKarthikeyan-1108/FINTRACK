version: '3.9'

services:
  # ── MySQL 8 ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: fintrack_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fintrack_root_2026}
      MYSQL_DATABASE:      ${DB_NAME:-fintrack_db}
      MYSQL_USER:          ${DB_USER:-fintrack_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-fintrack_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-fintrack_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fintrack_net

  # ── Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV:               production
      PORT:                   5000
      DB_HOST:                mysql
      DB_PORT:                3306
      DB_USER:                ${DB_USER:-fintrack_user}
      DB_PASSWORD:            ${DB_PASSWORD:-fintrack_pass_2026}
      DB_NAME:                ${DB_NAME:-fintrack_db}
      JWT_SECRET:             ${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_MIN_32_CHARS}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET:-CHANGE_ME_REFRESH_SECRET_MIN_32_CHARS}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      DEMO_OTP:               ${DEMO_OTP:-true}
      DEMO_OTP_CODE:          ${DEMO_OTP_CODE:-742819}
      FRONTEND_URL:           ${FRONTEND_URL:-http://localhost}
    expose:
      - "5000"
    networks:
      - fintrack_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    networks:
      - fintrack_net

volumes:
  mysql_data:
    driver: local

networks:
  fintrack_net:
    driver: bridge
